; 王牌飞行员设置。通过 FPMCI 工作台打开面板。
; 在工作台点击「保存设置」，下次启动游戏时生效。
; Preset 是预设标记，下方各项为实际设置。
Preset=Off
; 0 由游戏决定，1 至 5 统一敌方等级。
ForceRank=0
; 1 至 10 倍，高等级机动的权重。
SkilledBoost=1
; 1 至 20 倍，王牌机动的权重上限。
TopAceBoost=1
; 低等级机动权重的除数，1000 表示不采用。
WeakDivide=1
; 1 使所有飞行员使用 5 级机动权重。
Rank5Odds=0
; 1 至 3 倍，转向速度和加速度倍率。
Agility=1
; 2 至 8 枚，单个敌人的在空导弹上限。
Missiles=2
; 0 至 10 秒，黑视前的额外过载时间。
BlackoutBonus=0
; 1 取消攻击排队。
IgnoreAttackQueue=0
; 1 允许使用热焰弹。
ForceFlares=0
; 1 允许规避。
ForceEvade=0
; 1 允许挑衅机动。
ForceTaunts=0
; 1 仅飞机，0 也调整地面和海面单位。
AirOnly=1
; 1 包含友军。
IncludeAllies=0
; 机动调整的起始难度：1 为全部，4 为精英，5 为王牌。
FromDifficulty=4
; 0 至 100。替换高难度脚本的概率。评分见 acepilots_scripts.ini。
ScriptBias=0
; 1 允许选择战役未使用的脚本。
ScriptUnused=0
FlareMaxTotal=9
