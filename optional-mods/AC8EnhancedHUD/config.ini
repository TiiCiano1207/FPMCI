; AC8EnhancedHUD reads this file at startup. Mod Settings saves menu overrides separately.
; Reset Defaults in Mod Settings uses the values from this file.

[Sizes]
; Pitch marks, center instruments and EEGS circle and pipper size. Range 0.25 to 2.00.
Center = 0.60
; Stock gun reticle size. The EEGS pipper follows Center. Range 0.25 to 2.00.
GunReticle = 0.60
; World-projected target box size in all flight views. 1.00 is stock. Range 0.25 to 2.00.
TargetBoxes = 1.00
; Shared readout size for altitude/speed/bearing. Range 0.25 to 2.00.
ReadoutSize = 0.60

[EEGS]
; Off, Automatic, or Manual. In Manual, hold Switch Weapon to toggle EEGS. Automatic is based on distance.
Mode = Automatic
; Automatic entry distance in metres. The same target exits at 110% of this distance.
; While EEGS is active in Automatic or Manual, the stock gun reticle uses the same 110% limit.
RangeMeters = 1800
; Circle center offset in percent of its diameter, from -50 to +50. Positive raises the circle.
; 0 centers the nose. At -10 the nose sits 60% of the way up the circle.
CircleHeightPercent = -10
; Reference bullet speed for computations. Stock game speed is 1390 m/s.
; Range 200 to 2000 m/s in steps of 10.
FunnelMuzzleSpeed = 1390
; Reference wingspan between the two rails in metres. Range 4 to 80 in steps of 0.5.
FunnelWingspan = 15

[Cockpit]
; Mask the center HUD so it stays inside the cockpit sight.
VisorMask = true
; Speed and altitude readouts follow the camera.
FixedReadouts = true
; The bearing follows the camera and shows its heading. Off uses the aircraft compass.
RelativeBearing = true
; Place followed readouts on the cockpit HUD while looking forward. The bearing there shows aircraft heading.
DetachForward = true

[HUDView]
; Speed and altitude readouts follow the camera.
FixedReadouts = true
; The bearing follows the camera and shows its heading. Off uses the aircraft compass.
RelativeBearing = true
; Place followed readouts on the HUD while looking forward, using ReadoutPositions. The bearing there shows aircraft heading.
DetachForward = true

[ThirdPerson]
; FPMCI cockpit-style instruments in chase view.
CockpitHUD = false
; Draw the camera bearing above the aircraft at ReadoutSize.
CustomBearing = false

[Notifications]
; Show, Hide, or Discreet. Show is default game behavior. Hide doesn't notify at all. Discreet shows a small symbol (+ x o) just off center.
Hit = Show
Destroyed = Show
Missed = Show

[ReadoutPositions]
; Custom positions for speed/altitude/bearing
; Zero uses each readout's stock position at ReadoutSize. Positive X moves right and positive Y moves up.
; Offsets are percentages of the scaled HUD width or height, from -100 to 100 in steps of 1.
SpeedOffsetX = 0
SpeedOffsetY = 0
AltitudeOffsetX = 0
AltitudeOffsetY = 0
CompassOffsetX = 0
CompassOffsetY = 0

[ForwardReadoutPositions]
; Cockpit glass offsets when DetachForward is enabled. Same percentage units as ReadoutPositions.
SpeedOffsetX = 10
SpeedOffsetY = 0
AltitudeOffsetX = -10
AltitudeOffsetY = 0
CompassOffsetX = 0
CompassOffsetY = -6
