# SP Weapon Customizer 2.6
# Choose weapons in the game's SP1 / SP2 menus. Restart the game after editing this file.
#
# Enabled             1 = mod on, 0 = mod off
# UseHighestCapacity  1 = replacement weapons get the highest vanilla reserve ammo
#                     0 = keep the original slot's reserve ammo (only if you have mods that modify ammo count)
# WeaponModel         US, EU or RU model for replacement weapons
# GUN, MGP            CTR = straight ahead, LOW = 2.5 degrees down (player aircraft only)

