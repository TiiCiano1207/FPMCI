; ============================================================================
; AC8ProximityFuse v0.0.2 - 玩家对空导弹近炸引信配置 / Player AAM Proximity Fuse Config
; ============================================================================
; 修改此文件后，可在游戏内直接按 [F7] 键实时重新读取配置并应用，无需重启游戏。
; After editing this file, press [F7] in-game to hot-reload settings immediately.

[ProximityFuse]
; 近炸工作模式 (0 或 1，默认: 1)
; 1 = 模式1：属性全量写入 + 主动近炸空爆触发（推荐，导弹进入触发距离后自动触发脱靶空爆与范围伤害）
; 0 = 仅静态写入属性（仅修改 CDO、DT_WeaponSettings 难度表与武器实例字段，不主动干预脱锁）
; Proximity Fuse Mode (0 or 1, Default: 1)
FuseMode = 1

; 近炸触发距离（米，范围: 1 ~ 200，默认: 30）
; 导弹与锁定目标距离小于等于该值时触发近炸引信。
; Proximity trigger radius in meters (Range: 1 ~ 200, Default: 30)
TriggerRadiusMeters = 30

; 爆炸杀伤半径（米，范围: 1 ~ 500，默认: 50，原版 SASM: 50）
; 近炸自爆时的范围伤害半径（必须大于 TriggerRadiusMeters 才能保证炸中目标）。
; Explosion blast radius in meters (Range: 1 ~ 500, Default: 50, Vanilla SASM: 50)
ExplosionRadiusMeters = 50

; 范围爆炸伤害（范围: 1 ~ 500，默认: 30，原版 SASM: 30，原版普通导弹直击: 40~56）
; 近炸对爆炸半径内目标造成的基础范围伤害（若觉得刮痧可调高至 60~100）。
; Area of effect (AoE) damage (Range: 1 ~ 500, Default: 30, Vanilla SASM: 30)
AreaDamage = 30

; ----------------------------------------------------------------------------
; 弹种独立开关 (1 = 开启近炸, 0 = 保持原版)
; Per-weapon-type toggles (1 = Enable proximity fuse, 0 = Keep vanilla)
; ----------------------------------------------------------------------------
msl  = 1
qaam = 1
hvaa = 1
laam = 1
hcaa = 1
hpaa = 1
saam = 1
sasm = 1
2aam = 1
4aam = 1
6aam = 1
