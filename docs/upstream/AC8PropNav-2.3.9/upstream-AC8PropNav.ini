; ----------------------------------------------------------------------------
;  敌方武器 / Enemy weapons
; ----------------------------------------------------------------------------
;
;  出厂只给敌方普通导弹一点提前量（0.3），明显弱于玩家 ——
;  你能甩掉敌弹，敌机比较难甩掉你的弹。
;
;  ★ 想让敌方保持原版：把整个 [enemy] 段注释掉。
;
;  A small lead (0.3) for enemy missiles only, clearly weaker than the
;  player's, so you can still dodge them.
;
;  ★ To keep enemies vanilla, comment out the whole [enemy] section.
;
;  敌方也吃 MaxRotationAngle / MaxHomingAngle。
;  敌方没有 LockonRange —— 敌机不锁定，那个字段对它们没意义。
;
;  Enemies take MaxRotationAngle / MaxHomingAngle too.
;  There is no LockonRange here: enemies do not lock on.
;
; ----------------------------------------------------------------------------
[enemy]

msl = {
    HomingForesightAmount = 0.3
    MaxRotationAngle      =
    MaxHomingAngle        =
    LifeTime              =
}
