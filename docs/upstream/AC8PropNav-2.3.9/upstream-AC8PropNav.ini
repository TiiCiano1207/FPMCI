; ============================================================================
;  AC8PropNav — 配置 / Configuration
; ============================================================================
;
;  每个型号都列好了属性名 —— 你只需要改数字。等号后留空 = 保持原版。
;
;  Names are pre-filled: just edit the numbers. Blank = keep vanilla.
;
; ============================================================================
;  属性 / Properties
; ============================================================================
;
;  HomingForesightAmount —— 比例制导（提前量），主参数
;      0    = 原版，纯追踪
;      1.0  = 提前量拉满
;
;  HomingForesightAmount - proportional lead, the main parameter
;      0    = vanilla, pure pursuit
;      1.0  = full lead
;
; ----------------------------------------------------------------------------
;
;  MaxHomingAngle —— 导引头视场，单位度
;      敌机必须落在这个角度以内才会被跟踪。
;      超出视场就失去制导 —— 哪怕你已经锁定了它。
;      360 = 几乎永远不会脱靶（比例制导为 0 也照样咬住）
;      原版：MSL 75   QAAM 120   LAAM 90   HVAA 65   4AAM 65
;
;  MaxHomingAngle - seeker field of view, in degrees
;      A target outside this cone is NOT tracked, even if you have lock on it.
;      360 = almost never loses the target.
;      vanilla: MSL 75   QAAM 120   LAAM 90   HVAA 65   4AAM 65
;
; ----------------------------------------------------------------------------
;
;  MaxRotationAngle —— 转向速率，度/秒
;      调大 = 拐得更急、更难被甩掉；调小 = 更笨、更容易甩
;      原版：MSL 40   QAAM 75   LAAM 150   HVAA 55   4AAM 45
;
;  MaxRotationAngle - turn rate, in degrees per second
;      Higher turns harder and is harder to dodge; lower is clumsier.
;      vanilla: MSL 40   QAAM 75   LAAM 150   HVAA 55   4AAM 45
;
; ----------------------------------------------------------------------------
;
;  LifeTime —— 存活时间，秒。它就是"射程"的直接控制量
;      射程 ≈ LifeTime × 速度。原版 MSL 是 9 秒 ≈ 9.7 km
;      填太大会一路追下去，可能飞出战场
;
;  LifeTime - lifetime in seconds; this is what sets the range
;      range ≈ lifetime × speed.  vanilla MSL: 9 s ≈ 9.7 km
;      Too large and the missile chases on and on, possibly off the map.
;
; ----------------------------------------------------------------------------
;
;  LockonRange —— 锁定距离，单位米（只对玩家有效）
;      改的是你 HUD 上那个锁定圈。原版 MSL 2000
;      ★ 改完要**切一次武器**才生效（进关卡后切一次即可）。
;
;  LockonRange - lock-on range in metres (player only)
;      This is the lock ring on your HUD.  vanilla MSL: 2000
;      ★ Takes effect after one weapon switch (once per level).
;
; ============================================================================
;  规则 / Rules
; ============================================================================
;
;  · 只改你填了数字的项；留空 = 保持原版
;  · 型号键按长度降序匹配 ⇒ 写 4aam 不会被 aam 抢走
;  · 旧写法 msl = 0.8 仍然有效（等价于只设比例制导）
;
;  · Only entries with a number are changed; blank = keep vanilla.
;  · Keys match longest-first, so 4aam is not stolen by aam.
;  · The old form msl = 0.8 still works (same as setting only the lead).
;
; ============================================================================


; ----------------------------------------------------------------------------
;  玩家武器 / Player weapons
; ----------------------------------------------------------------------------
;
;  出厂只设比例制导，其余四项留空 = 保持原版。
;  理由：各型号的原作值差别很大（LAAM 的转向速率是 MSL 的近 4 倍），
;  写死一个数会悄悄改掉所有型号的手感。
;
;  Factory default sets only the lead. The other four are left blank on
;  purpose - vanilla values differ a lot per missile, so hard-coding one
;  number would silently change every missile's feel.
;
;  想调成"几乎甩不掉"，试这两个：
;      MaxHomingAngle   = 360      （单这一项就已经很强）
;      MaxRotationAngle = 60
;
;  For near-unavoidable missiles, try:
;      MaxHomingAngle   = 360      (this alone is already strong)
;      MaxRotationAngle = 60
;
; ----------------------------------------------------------------------------
[player]

msl = {
    HomingForesightAmount = 0.7
    LockonRange           =
    MaxRotationAngle      =
    MaxHomingAngle        =
    LifeTime              =
}

qaam = {
    HomingForesightAmount = 1.0
